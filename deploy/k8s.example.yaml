# Generisches Beispiel – Namen, Domain und Secrets anpassen.
apiVersion: v1
kind: Secret
metadata: { name: hv-planer, namespace: hv-planer }
type: Opaque
stringData:
  SESSION_SECRET: "CHANGE-ME-openssl-rand-hex-32"
  OIDC_CLIENT_SECRET: "CHANGE-ME"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: hv-planer-data, namespace: hv-planer }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hv-planer, namespace: hv-planer }
spec:
  replicas: 1            # SQLite: genau ein Pod
  strategy: { type: Recreate }
  selector: { matchLabels: { app: hv-planer } }
  template:
    metadata: { labels: { app: hv-planer } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: hv-planer
          image: registry.example.com/hv-planer:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: APP_URL, value: "https://planer.example.com" }
            - { name: OIDC_ISSUER_URL, value: "https://idp.example.com/application/o/hv-planer/" }
            - { name: OIDC_CLIENT_ID, value: "hv-planer" }
            - { name: OIDC_PROVIDER_NAME, value: "SSO" }
          envFrom: [{ secretRef: { name: hv-planer } }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: hv-planer-data } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: hv-planer, namespace: hv-planer }
spec:
  selector: { app: hv-planer }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: hv-planer, namespace: hv-planer }
spec:
  # ingressClassName / TLS-Annotationen an den eigenen Ingress-Controller anpassen
  rules:
    - host: planer.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: hv-planer, port: { name: http } } } }
